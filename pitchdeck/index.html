<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison Maxine ✦ private</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Pixelify+Sans&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:'Musicca Swash';
  src:url('/mussica-swash.otf') format('opentype');
  font-weight:normal;font-style:normal;font-display:swap;
}
:root{
  --rasp:#c76090; --deep:#8a1a4a; --blush:#f7cdeb;
  --cream:#fff8fc; --paper:#fef8fb; --ink:#5a3a4a; --line:#f0cfe0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Cormorant Garamond',Georgia,serif;
  color:var(--ink);
  background:var(--cream) url('/idx-11cfe590.jpg') repeat;
  background-size:420px auto;
}
body::before{content:'';position:fixed;inset:0;background:rgba(255,250,253,.72);z-index:0;pointer-events:none}

/* ═══════════ GATE ═══════════ */
#gate{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:var(--cream) url('/idx-11cfe590.jpg') repeat;background-size:420px auto;
}
#gate::before{content:'';position:absolute;inset:0;background:rgba(255,250,253,.82)}
.gate-card{
  position:relative;z-index:2;width:min(90vw,420px);
  background:var(--paper);border:1.5px solid var(--line);border-radius:22px;
  padding:44px 38px 38px;text-align:center;
  box-shadow:0 10px 40px rgba(199,96,144,.16),0 2px 8px rgba(199,96,144,.1);
}
.gate-card .lock{font-size:22px;color:var(--rasp);opacity:.7;margin-bottom:6px}
.gate-card .gw{font-family:'Musicca Swash','Great Vibes',cursive;font-size:52px;color:var(--rasp);line-height:1;margin-bottom:4px}
.gate-card .gsub{font-family:'IM Fell English',serif;font-style:italic;font-size:13.5px;color:var(--deep);opacity:.8;margin-bottom:26px;letter-spacing:.02em}
.gate-card .glabel{font-family:'Pixelify Sans',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--rasp);display:block;margin-bottom:8px;text-align:left}
#pw{
  width:100%;padding:13px 15px;font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:12px;outline:none;transition:border-color .2s,box-shadow .2s;
}
#pw:focus{border-color:var(--rasp);box-shadow:0 0 0 3px rgba(199,96,144,.12)}
#enterBtn{
  width:100%;margin-top:16px;padding:13px;cursor:pointer;
  font-family:'Pixelify Sans',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:#fff;background:var(--rasp);border:none;border-radius:12px;transition:background .2s,transform .1s;
}
#enterBtn:hover{background:var(--deep)}
#enterBtn:active{transform:scale(.98)}
#enterBtn:disabled{opacity:.6;cursor:progress}
.gate-err{min-height:18px;margin-top:14px;font-family:'IM Fell English',serif;font-style:italic;font-size:13px;color:#b23a5a;opacity:0;transition:opacity .2s}
.gate-err.show{opacity:1}
.gate-foot{margin-top:22px;font-family:'IM Fell English',serif;font-size:10.5px;color:var(--rasp);opacity:.55;letter-spacing:.05em}

/* ═══════════ DECK ═══════════ */
#deck{position:relative;z-index:1;display:none}
#deck.on{display:block}
.slide{
  position:relative;min-height:100vh;padding:86px 7vw 96px;
  display:flex;flex-direction:column;justify-content:center;
  max-width:1120px;margin:0 auto;
}
.s-label{font-family:'Pixelify Sans',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rasp);margin-bottom:18px}
.slide h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4.6vw,52px);line-height:1.08;color:var(--deep);letter-spacing:-.01em;max-width:16ch}
.slide h2.tight{margin-bottom:4px}
.eyebrow{font-family:'Pixelify Sans',sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--rasp);margin-bottom:20px}

/* cover */
.cover{align-items:flex-start;text-align:left}
.wordmark{font-family:'Musicca Swash','Great Vibes',cursive;font-weight:400;font-size:clamp(58px,9.5vw,124px);color:var(--rasp);line-height:1.12;text-shadow:0 4px 30px rgba(247,205,235,.6)}
.cover-tag{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(16px,2.2vw,24px);color:var(--deep);margin-top:18px;letter-spacing:.02em}
.cover-sub{font-size:clamp(15px,1.8vw,19px);color:var(--ink);opacity:.8;margin-top:10px;letter-spacing:.04em}
.cover-by{font-family:'Pixelify Sans',sans-serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rasp);margin-top:40px;opacity:.85}

/* columns / cards */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:0 4px 18px rgba(199,96,144,.07)}
.card p{font-size:18px;line-height:1.5}
.card-n{font-family:'Musicca Swash','Great Vibes',cursive;font-size:38px;color:var(--rasp);line-height:1;margin-bottom:8px}
.card-h{font-family:'Pixelify Sans',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rasp);margin-bottom:10px}

/* testimonials */
.stars{color:var(--rasp);letter-spacing:3px;font-size:14px;margin-bottom:10px}
.quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.5;color:var(--ink)}
.q-author{font-family:'Pixelify Sans',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rasp);margin-top:14px}

/* ticks */
.ticks{list-style:none;margin-top:34px;max-width:34ch}
.ticks.center{margin-left:auto;margin-right:auto;text-align:left}
.ticks li{position:relative;padding-left:34px;font-size:clamp(18px,2.2vw,23px);line-height:1.45;margin-bottom:20px;color:var(--ink)}
.ticks li::before{content:'✦';position:absolute;left:0;top:2px;color:var(--rasp)}

/* product */
.product-row{display:grid;grid-template-columns:1fr 1.15fr;gap:50px;align-items:center;margin-top:20px}
.product-shot{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:26px;text-align:center;box-shadow:0 8px 30px rgba(199,96,144,.12)}
.product-shot img{max-width:100%;max-height:52vh;border-radius:10px}
.spec-tag{display:inline-block;font-family:'Pixelify Sans',sans-serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rasp);border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin-bottom:18px}
.ingredients{list-style:none;margin:6px 0 24px}
.ingredients li{font-family:'IM Fell English',serif;font-style:italic;font-size:19px;color:var(--deep);padding:5px 0;border-bottom:1px dashed var(--line)}
.ingredients li:last-child{border-bottom:none;color:var(--rasp)}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spec-grid>div{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.sg-k{font-family:'Pixelify Sans',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--rasp)}
.sg-v{font-size:19px;color:var(--deep)}

/* tam / metrics / unit econ */
.tam-row,.metrics,.unit-econ,.use-funds{display:flex;flex-wrap:wrap;gap:16px;margin-top:34px}
.tam,.metric,.unit-econ>div,.uf{flex:1;min-width:130px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.tam-k,.m-k,.ue-k,.uf-k{font-family:'Pixelify Sans',sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rasp)}
.m-v,.ue-v{font-size:26px;color:var(--deep);font-weight:500}
.tam .ph,.tam-k{font-size:15px}
.tam .ph{font-size:24px}

/* stockists */
.stockists{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.stk{font-family:'IM Fell English',serif;font-style:italic;font-size:20px;color:var(--deep);background:var(--paper);border:1.5px solid var(--line);border-radius:40px;padding:12px 24px;box-shadow:0 3px 12px rgba(199,96,144,.08)}
.foot-note{margin-top:26px;font-family:'IM Fell English',serif;font-style:italic;font-size:15px;color:var(--rasp);opacity:.85}

/* big narrative statement slides */
.big-quote{justify-content:center}
.statement{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,5vw,58px);line-height:1.85;color:var(--deep);letter-spacing:-.01em;max-width:20ch}
.statement.center{margin-left:auto;margin-right:auto;text-align:center;max-width:22ch}
.statement em{font-family:'Musicca Swash','Great Vibes',cursive;font-style:normal;font-size:1.02em;color:var(--rasp);line-height:1;padding:0 .06em}
.lead-left{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(17px,2.1vw,23px);color:var(--ink);opacity:.9;margin-top:26px;max-width:44ch;line-height:1.5}

/* category row (opening slide) */
.cat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.cat{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
.cat-k{font-family:'Pixelify Sans',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.7}
.cat-v{font-family:'IM Fell English',serif;font-style:italic;font-size:16px;color:var(--rasp)}
.cat.open{background:linear-gradient(160deg,#fff,var(--blush));border-color:var(--rasp);box-shadow:0 6px 22px rgba(199,96,144,.18)}
.cat.open .cat-k{color:var(--deep);opacity:1}
.cat.open .cat-v{font-size:17px;color:var(--deep)}

/* 4-column grid */
.cols.four{grid-template-columns:repeat(4,1fr)}
.cols.four .card p{font-size:16px}

/* closer line on ask */
.closer{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(17px,2.3vw,24px);color:var(--deep);max-width:34ch;margin:34px auto 0;line-height:1.45}

/* market split (text + consumer photo) */
.market-split{display:grid;grid-template-columns:1.25fr .8fr;gap:40px;align-items:center;margin-bottom:8px}
.market-split img{width:100%;max-height:52vh;object-fit:cover;border-radius:16px;display:block;box-shadow:0 8px 26px rgba(199,96,144,.14)}
/* quote split (statement + photo) */
.quote-split{display:grid;grid-template-columns:1.4fr .7fr;gap:44px;align-items:center;width:100%}
.quote-split .statement{max-width:none}
.quote-split img{width:100%;max-height:60vh;object-fit:cover;border-radius:16px;display:block;box-shadow:0 8px 26px rgba(199,96,144,.14)}

/* mission / ask centered */
.mission,.ask{align-items:center;text-align:center}
.mission h2,.ask h2{max-width:22ch}
.wordmark-sm{font-family:'Musicca Swash','Great Vibes',cursive;font-size:clamp(40px,6vw,70px);color:var(--rasp);line-height:1}
.lead{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(20px,2.6vw,28px);color:var(--deep);margin-top:16px}

/* team */
.team-row{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:36px}
.member{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:26px;text-align:center;box-shadow:0 4px 18px rgba(199,96,144,.07)}
.member img{width:130px;height:130px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid var(--blush);margin-bottom:14px}
.member.ghost{display:flex;flex-direction:column;justify-content:center;border-style:dashed}
.member.wide{display:flex;flex-direction:column;justify-content:center;text-align:left}
.facts{list-style:none;margin:0}
.facts li{position:relative;padding-left:26px;font-size:17px;line-height:1.45;margin-bottom:14px;color:var(--ink)}
.facts li:last-child{margin-bottom:0}
.facts li::before{content:'✦';position:absolute;left:0;top:1px;color:var(--rasp)}
.m-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--deep)}
.m-role{font-family:'Pixelify Sans',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rasp);margin:4px 0 14px}
.member p{font-size:16px;line-height:1.45}

/* ask contact */
.use-funds{margin-top:40px}
.uf{gap:8px}
.uf-k{font-size:10px}
.contact{margin-top:46px;display:flex;flex-direction:column;align-items:center;gap:10px}
.contact-lines{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;font-family:'IM Fell English',serif;font-style:italic;font-size:17px;color:var(--deep)}

/* placeholders founder must fill */
.ph{display:inline-block;font-family:'Pixelify Sans',sans-serif;font-size:.7em;letter-spacing:.04em;color:#b06;background:rgba(247,205,235,.5);border:1px dashed var(--rasp);border-radius:6px;padding:2px 8px;font-style:normal;vertical-align:middle}
/* investor highlight — bold + light-green marker */
.hl{background:#dcefb8;font-weight:700;color:var(--deep);padding:0 4px;border-radius:4px;font-style:normal;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ph.big{font-size:.85em;padding:4px 14px}
em{font-style:italic;color:var(--deep)}

/* progress dots */
#dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:20;display:none;flex-direction:column;gap:11px}
#deck.on ~ #dots{display:flex}
#dots button{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rasp);background:transparent;cursor:pointer;padding:0;transition:background .2s,transform .2s}
#dots button.active{background:var(--rasp);transform:scale(1.3)}
#dots button:hover{background:var(--blush)}

/* slide counter */
#counter{position:fixed;left:22px;bottom:20px;z-index:20;display:none;font-family:'Pixelify Sans',sans-serif;font-size:10px;letter-spacing:.1em;color:var(--rasp)}
#deck.on ~ #counter{display:block}

@media (max-width:820px){
  .cols,.cols.four,.product-row,.team-row,.cat-row{grid-template-columns:1fr 1fr}
  .product-row,.team-row,.market-split,.quote-split{grid-template-columns:1fr}
  .product-row{gap:26px}
  #dots{display:none!important}
  .slide{padding:76px 26px 80px}
}

/* print → clean PDF export, one slide per page */
@media print{
  body::before,#gate,#dots,#counter{display:none!important}
  body{background:#fff}
  #deck{display:block!important}
  .slide{min-height:auto;height:auto;page-break-after:always;padding:40px 50px;max-width:none}
  .card,.member,.product-shot,.tam,.metric,.stk,.uf,.unit-econ>div{box-shadow:none}
}
</style>
<!-- GoatCounter analytics — no auto-count; we fire it only after unlock (real viewers) -->
<script>window.goatcounter = { no_onload: true }</script>
<script data-goatcounter="https://maisonmaxine.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="lock">✦</div>
    <div class="gw">Maison Maxine</div>
    <div class="gsub">private — for invited eyes only ♡</div>
    <label class="glabel" for="pw">enter password</label>
    <input type="password" id="pw" autocomplete="off" autofocus>
    <button type="submit" id="enterBtn">come inside ✦</button>
    <div class="gate-err" id="err">that's not quite it — try again ♡</div>
    <div class="gate-foot">© 2026 maison maxine™ · confidential</div>
  </form>
</div>

<!-- DECK (filled after decrypt) -->
<div id="deck"></div>
<div id="dots"></div>
<div id="counter"></div>

<script>
/* Encrypted deck payload — content is AES-GCM encrypted; only ciphertext ships.
   Loaded from deck.enc.json (salt, iv, ciphertext — all base64). */
let PAYLOAD = null;
async function loadPayload(){
  if(PAYLOAD) return PAYLOAD;
  PAYLOAD = await (await fetch('deck.enc.json',{cache:'no-store'})).json();
  return PAYLOAD;
}

function b64buf(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}

async function decryptDeck(pw){
  await loadPayload();
  const enc=new TextEncoder();
  const keyMat=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64buf(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},
    keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64buf(PAYLOAD.iv)},key,b64buf(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}

function buildNav(){
  const deck=document.getElementById('deck');
  const slides=[...deck.querySelectorAll('.slide')];
  const dots=document.getElementById('dots');
  const counter=document.getElementById('counter');
  slides.forEach((s,i)=>{
    const b=document.createElement('button');
    b.setAttribute('aria-label','slide '+(i+1));
    b.onclick=()=>s.scrollIntoView({behavior:'smooth'});
    dots.appendChild(b);
  });
  const dotEls=[...dots.children];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const i=slides.indexOf(e.target);
        dotEls.forEach((d,j)=>d.classList.toggle('active',j===i));
        counter.textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
      }
    });
  },{threshold:.55});
  slides.forEach(s=>io.observe(s));
  let idx=0;
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();idx=Math.min(idx+1,slides.length-1);slides[idx].scrollIntoView({behavior:'smooth'});}
    if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();idx=Math.max(idx-1,0);slides[idx].scrollIntoView({behavior:'smooth'});}
  });
}

async function unlock(pw){
  const html=await decryptDeck(pw);           // throws if wrong password
  const deck=document.getElementById('deck');
  deck.innerHTML=html;
  deck.classList.add('on');
  document.getElementById('gate').style.display='none';
  document.body.style.overflow='';
  buildNav();
  try{sessionStorage.setItem('mm_pd','1');}catch(e){}
  // count a real viewer (records country/referrer in GoatCounter)
  try{ if(window.goatcounter&&window.goatcounter.count){ window.goatcounter.count({path:'deck-viewed', title:'Pitch Deck Viewed'}); } }catch(e){}
}

document.getElementById('gateForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('enterBtn');
  const err=document.getElementById('err');
  const pw=document.getElementById('pw').value;
  err.classList.remove('show');
  btn.disabled=true;btn.textContent='unlocking…';
  try{
    await unlock(pw);
  }catch(err2){
    err.classList.add('show');
    btn.disabled=false;btn.textContent='come inside ✦';
    const pwf=document.getElementById('pw');pwf.value='';pwf.focus();
  }
});
</script>
</body>
</html>
