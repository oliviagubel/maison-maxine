<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Spritz Club 01 · Maison Maxine</title>
<meta name="description" content="Spritz Club 01: the Maison Maxine beauty partner deck.">
<link rel="icon" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
/* spritz club 01: the beauty partner deck, slide by slide, with the pdf to
   download. only reachable by its link; nothing on the site points here. */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#f4eef0;color:#1d1b1c;
  font-family:'EB Garamond',Garamond,Georgia,serif;
  padding:0 16px calc(48px + env(safe-area-inset-bottom));
}
.top{
  max-width:1100px;margin:0 auto;padding:28px 0 22px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.name{font-size:22px;letter-spacing:.01em}
.name span{color:#7a6f73;font-size:16px;margin-left:8px}
.dl{
  display:inline-flex;align-items:center;min-height:44px;padding:0 18px;
  background:#1d1b1c;color:#fff;border-radius:6px;text-decoration:none;font-size:16px;
}
.dl:focus-visible{outline:2px solid #1d1b1c;outline-offset:3px}
.deck{max-width:1100px;margin:0 auto;display:grid;gap:18px}
.slide{background:#fcf9fa;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(29,27,28,.35)}
.slide img{display:block;width:100%;height:auto}
.foot{max-width:1100px;margin:28px auto 0;text-align:center;font-size:17px;line-height:1.8;color:#4a4346}
.foot a{color:#1d1b1c;text-underline-offset:3px}
@media(max-width:700px){
  .top{padding:20px 0 16px}
  .deck{gap:12px}
}
</style>
</head>
<body>
  <header class="top">
    <div class="name">maison maxine <span>spritz club 01 · beauty partners</span></div>
    <a class="dl" href="Spritz-Club-01-Beauty-Partners.pdf" download>download the pdf</a>
  </header>
  <main class="deck">
    <figure class="slide">
      <picture>
        <source media="(max-width:700px)" srcset="slide-01-sm.jpg">
        <img src="slide-01.jpg" width="2000" height="1125" fetchpriority="high" decoding="async"
             alt="slide 1, cover: maison maxine and beauty partners, spritz club 01. a new kind of subscription box: a bottle of sangria, a 4-pack of our spritzers, a haircare or skincare product, a makeup product, a collectible sticker and a playlist of artists under 1M monthly listeners. pictured: the spritz vault box with a playlist card, a cab spritz box, a sangria bottle, a serum, a perfume and a satin scrunchie. pr@maisonmaxine.world">
      </picture>
    </figure>
    <figure class="slide">
      <picture>
        <source media="(max-width:700px)" srcset="slide-02-sm.jpg">
        <img src="slide-02.jpg" width="2000" height="1125" loading="lazy" decoding="async"
             alt="slide 2, what&#x27;s in the box: a small box, actually opened. sangria and spritz: a bottle of our sangria and a 4-pack of our spritzers, sweetened only with fruit and honey. a collectible sticker: a new design every drop. a playlist: artists under 1M monthly listeners. your product: one haircare or skincare product and one makeup product each month. members: gen z and millennial women, all 21+ and age-verified at checkout. ingredient readers who chose a four-ingredient spritz sweetened only with honey. high disposable income: they pay for quality and try what lands on their doorstep.">
      </picture>
    </figure>
    <figure class="slide">
      <picture>
        <source media="(max-width:700px)" srcset="slide-03-sm.jpg">
        <img src="slide-03.jpg" width="2000" height="1125" loading="lazy" decoding="async"
             alt="slide 3, why it&#x27;s worth it for you: seeding you can actually measure. the only brand in your category: two partners a month, never two in the same category, no gift bag of ten samples. a code for every member: see exactly who shops, and we share the results back with you. content you didn&#x27;t pay for: we boost the unboxing posts, so you get real customers using your product. your customer, already here: women who read labels and spend on quality, and who signed up to discover new brands.">
      </picture>
    </figure>
    <figure class="slide">
      <picture>
        <source media="(max-width:700px)" srcset="slide-04-sm.jpg">
        <img src="slide-04.jpg" width="2000" height="1125" loading="lazy" decoding="async"
             alt="slide 4, the math: about $295 of product at cost puts your full-size product in the hands of 30 age-verified women for a month, about $10 per customer who has actually used your product. ads can&#x27;t buy that, they can only buy a look. the same $295, two ways, year-one roi. low case: meta ads about 0.9x at $148 a customer, spritz club about 1.3x if 1 in 10 buy. mid case: meta ads about 2.1x at $61 a customer, spritz club about 2.6x if 1 in 5 buy. high case: meta ads about 3.4x at $38 a customer, spritz club about 4.3x if 1 in 3 buy. spritz club beats meta&#x27;s median once 1 in 6 members buy. the downside is capped at $295 of product, and every buyer has already used it for a month. illustrative: $30 product at about 30% cost, 30 units plus about $25 shipping. roi is year-one gross profit (about $185 revenue per customer at about 69% margin) divided by $295. meta range: beauty dtc cac benchmarks (eightx, 2026). low case: birchbox, 11.2% of sampled subscribers bought full size.">
      </picture>
    </figure>
    <figure class="slide">
      <picture>
        <source media="(max-width:700px)" srcset="slide-05-sm.jpg">
        <img src="slide-05.jpg" width="2000" height="1125" loading="lazy" decoding="async"
             alt="slide 5, the ask: here&#x27;s what it takes. you send: a product of your choice; 30 units for spritz club 01, 50+ for future drops as the club grows; a unique discount code for members; units shipped to us by jan 1. we handle: the box, packing and shipping; age-verified, 21+ members only; boosting the unboxing content on our socials; a results recap of code uses and content. no fees, just product.">
      </picture>
    </figure>
    <figure class="slide">
      <picture>
        <source media="(max-width:700px)" srcset="slide-06-sm.jpg">
        <img src="slide-06.jpg" width="2000" height="1125" loading="lazy" decoding="async"
             alt="slide 6, let&#x27;s put you in the box. 01 pick your product: any product works, a new launch you want to test, a slow seller that deserves a second look, or a favorite you want in more hands. 02 send us your discount code. 03 ship units by jan 1. kayla, pr@maisonmaxine.world">
      </picture>
    </figure>
  </main>
  <p class="foot">
    kayla · <a href="mailto:pr@maisonmaxine.world">pr@maisonmaxine.world</a>
  </p>
</body>
</html>
