  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',

}).addTo(map);

function makeIcon(color) {
  return L.divIcon({
    className: 'spritz-pin',
    html: `<div style="background:${color};width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8],
  });
}

const bounds = L.latLngBounds();
const enabledBrands = new Set();
const brandCounts = {};
STORES.forEach(s => {
  s.region = (s.lon < -100) ? 'LA' : (s.lat > 41.2 ? 'Upstate' : 'NYC');
  brandCounts[s.brand] = (brandCounts[s.brand] || 0) + 1;
  enabledBrands.add(s.brand);
  if (s.lat && s.lon) bounds.extend([s.lat, s.lon]);
});
let currentRegion = 'all';

const items = STORES.map(s => {
  if (!s.lat || !s.lon) return null;
  const m = L.marker([s.lat, s.lon], { icon: makeIcon(s.color) });
  m.bindPopup(`<div class="brand-tag" style="background:${s.color}">${s.brand}</div><div class="name">${s.name}</div><div class="addr">${s.addr}</div>`);
  return { marker: m, store: s };
}).filter(Boolean);

const brandsEl = document.getElementById('brands');

  const label = document.createElement('label');
  label.className = 'brand-toggle';

  label.querySelector('input').addEventListener('change', e => {
    if (e.target.checked) enabledBrands.add(brand); else enabledBrands.delete(brand);

  // clears the rest and flies the map to just this brand's stores.
  label.querySelector('.brand-only').addEventListener('click', e => {
    e.preventDefault();   // we sit inside a <label>, so a bare click toggles the box
    e.stopPropagation();
    setBrands([brand]);
    setRegion('all');
    filterEl.value = '';
    render();
    fitToRegion();
  });
  brandsEl.appendChild(label);
});

const resetBtn = document.createElement('button');
resetBtn.id = 'brand-reset';
resetBtn.type = 'button';
resetBtn.textContent = 'show all brands';
resetBtn.addEventListener('click', () => {
  setBrands(Object.keys(brandCounts));
  render();
  fitToRegion();
});
brandsEl.appendChild(resetBtn);

function setBrands(list) {
  enabledBrands.clear();
  list.forEach(b => enabledBrands.add(b));
  brandsEl.querySelectorAll('input[data-brand]').forEach(i => {
    i.checked = enabledBrands.has(i.dataset.brand);
  });
}

function setRegion(region) {
  currentRegion = region;
  document.querySelectorAll('#region-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.region === region));
}

const list = document.getElementById('list');
const countEl = document.getElementById('count');
const filterEl = document.getElementById('filter');

function render() {
  const f = (filterEl.value || '').toLowerCase().trim();
  list.innerHTML = '';
  let shown = 0;
  items.forEach(({ marker, store }) => {
    const hay = `${store.name} ${store.addr} ${store.zip}`.toLowerCase();
    const inRegion = currentRegion === 'all' || store.region === currentRegion;
    const show = inRegion && enabledBrands.has(store.brand) && (!f || hay.includes(f));
    if (show) {
      shown++;
      const div = document.createElement('div');
      div.className = 'store';
      div.innerHTML = `<div class="name"><span class="brand-tag" style="background:${store.color}">${store.brand}</span>${store.name}</div><div class="meta">${store.addr}</div>`;
      div.onclick = () => { map.setView([store.lat, store.lon], 15); marker.openPopup(); };
      list.appendChild(div);
      marker.addTo(map);
    } else {
      map.removeLayer(marker);
    }
  });
  countEl.textContent = `${shown} of ${items.length} stores shown`;
}

function fitToRegion() {
  const b = L.latLngBounds();
  items.forEach(({ store }) => {
    const inRegion = currentRegion === 'all' || store.region === currentRegion;
    if (inRegion && enabledBrands.has(store.brand)) b.extend([store.lat, store.lon]);
  });
  // a fit computed while the container is mid-layout lands at max zoom
  map.invalidateSize();
  if (b.isValid()) map.fitBounds(b, { padding: [30, 30] });
}

document.querySelectorAll('#region-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentRegion = btn.dataset.region;
    document.querySelectorAll('#region-toggle button').forEach(b => b.classList.toggle('active', b === btn));
    render();
    fitToRegion();
  });
});

filterEl.addEventListener('input', render);
render();
</script>
</body>
</html>
